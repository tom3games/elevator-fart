<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1b1620;--paper:#fff8ec;--paper-dk:#d8c9b2;--red:#ff3d2e;--red-dk:#a8170d;--yel:#ffd21f;--yel-dk:#a88300;
  --led:#ffb21e;--led-glow:rgba(255,150,20,.8);--steel:#b9bcc1;--teal:#16a394;--teal-dk:#0b5f56;--night:#2a2233;--disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
}
html{background:var(--night);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;color:var(--paper);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
body{overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,canvas{touch-action:manipulation}
button{font-family:inherit;color:inherit;font-size:inherit;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(20,10,25,.55) 100%)}

/* 共通部品 */
.view{position:fixed;inset:0;z-index:10;height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:max(58px,calc(env(safe-area-inset-top) + 52px)) 16px max(18px,calc(env(safe-area-inset-bottom) + 12px))}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:.04em;border:3px solid var(--ink);border-radius:16px;min-height:54px;padding:0 20px;cursor:pointer;width:100%;
  background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn svg{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.red{background:var(--red);color:#fff;font-size:21px;min-height:62px;text-shadow:0 2px 0 var(--red-dk)}
.btn.yel{background:var(--yel)}
.btn.ghost{background:rgba(27,22,32,.72);color:var(--paper);border-color:rgba(255,248,236,.55);box-shadow:none;font-size:16px;min-height:48px}
.row{display:flex;gap:10px;width:100%}
.row>.btn{flex:1;min-width:0}

#corner{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:40;display:flex;gap:8px}
#corner button{height:40px;min-width:44px;padding:0 10px;border-radius:12px;border:2px solid rgba(255,248,236,.5);background:rgba(27,22,32,.7);font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#corner svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* タイトル */
#vTitle{justify-content:space-between;gap:10px}
.logo{text-align:center;line-height:1;position:relative;width:min(560px,100%)}
.logo::before{content:'';position:absolute;inset:-18% -12%;z-index:-1;background:radial-gradient(closest-side,rgba(27,22,32,.88),rgba(27,22,32,0));pointer-events:none}
.logo{z-index:0}
.logo .en{display:inline-block;font-family:var(--disp);font-size:clamp(13px,3.6vw,18px);letter-spacing:.12em;color:var(--ink);background:var(--yel);padding:5px 12px 4px;border:3px solid var(--ink);transform:rotate(-3deg);box-shadow:3px 3px 0 var(--ink)}
.logo .main{display:block;margin-top:10px;font-family:var(--disp);font-size:min(12.5vw,7.4vh,72px);color:#fff;letter-spacing:.01em;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 26px rgba(255,61,46,.45)}
.logo .main b{color:var(--red);font-weight:400;display:inline-block;animation:shiver .18s steps(2) infinite}
html[lang=ja] .logo .main{font-family:"Zen Maru Gothic",var(--disp);font-weight:900;letter-spacing:.04em}
html[lang=ja] .logo .main b{font-family:var(--disp)}
html[lang=ja] .rank,html[lang=ja] .stamp,html[lang=ja] .verdict{font-family:"Zen Maru Gothic",var(--disp);font-weight:900}
@keyframes shiver{0%{transform:translate(0,0) rotate(-1deg)}50%{transform:translate(1px,-1px) rotate(1deg)}}
.tBottom{width:min(520px,100%);display:flex;flex-direction:column;gap:10px}
.mc{display:flex;gap:10px;align-items:flex-start;width:100%}
.mc .face{flex:none;width:46px;height:46px}
.bubble{position:relative;flex:1;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:9px 12px;font-weight:700;font-size:14px;line-height:1.55}
.bubble small{display:block;font-size:11px;color:var(--red-dk);font-weight:900}
.bubble::before{content:"";position:absolute;left:-11px;top:14px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}

/* 遊び方 */
#vHow{justify-content:center;gap:14px}
.panel{width:min(560px,100%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:16px 16px 12px;box-shadow:0 6px 0 var(--ink);min-height:0;overflow:hidden}
.credit{margin-top:8px;font-size:10px;line-height:1.4;color:#7a6d5c;text-align:center}.credit a{color:inherit}
.panel h2{font-family:var(--disp);font-weight:400;font-size:22px;text-align:center;margin-bottom:8px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;line-height:1.45}
.step svg{flex:none;width:44px;height:44px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:4px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.step b{color:var(--red-dk)}
#vHow .btn{width:min(560px,100%)}

/* プレイ（バー・メーターは置かない） */
#vPlay{padding:0;z-index:10;touch-action:none}
.hudTop{position:absolute;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 112px 0 max(10px,env(safe-area-inset-left));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.stChip{flex:none;display:flex;align-items:center;gap:12px;color:var(--led);padding:6px 12px 6px 10px;border-radius:2px;
  background:radial-gradient(rgba(255,170,30,.07) 1px,transparent 1.4px) 0 0/3px 3px,#0e0c0b;
  box-shadow:inset 0 0 0 1px #000,0 0 0 3px #8e9196,0 0 0 4px #4b4d52,0 2px 6px 4px rgba(0,0,0,.35)}
.stChip b{font-family:'DotGothic16',monospace;font-weight:400;font-size:22px;line-height:1;letter-spacing:.08em;text-shadow:0 0 6px var(--led-glow),0 0 1px var(--led)}
.stChip.hit{animation:hit .25s steps(2) 3}
@keyframes hit{50%{color:#ff5a3c;transform:translateX(3px)}}
#hLives{display:flex;gap:5px;padding-left:10px;border-left:1px solid #2b241c}
#hLives i{width:9px;height:9px;display:block;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led-glow);transition:background .2s,box-shadow .2s}
#hLives i.off{background:#2e2418;box-shadow:none}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .08s;box-shadow:inset 0 0 0 10px var(--yel),inset 0 0 80px rgba(255,210,31,.6)}
#flash.now{opacity:1;animation:blink .18s steps(2) infinite}
.hudBot{position:absolute;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right)) max(12px,calc(env(safe-area-inset-bottom) + 8px)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.farts{display:flex;align-items:center;justify-content:space-evenly;gap:10px;width:100%;max-width:400px;pointer-events:auto;padding:12px 14px;border-radius:4px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.03) 1px 2px,transparent 2px 4px),linear-gradient(180deg,#cfd2d6,#a7abb1 55%,#c2c5ca);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.4)}
.fb{position:relative;flex:none;width:clamp(60px,min(21vw,18vh),88px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#2b2d31;border:0;cursor:pointer;padding:0;overflow:hidden;touch-action:manipulation;--cd:0;
  background:radial-gradient(circle at 50% 38%,#fbfbfc,#d3d6da 55%,#9a9ea4 100%);
  box-shadow:0 0 0 3px #7a7e85,0 0 0 5px #e3e5e8,0 0 0 6px #6f7379,inset 0 -4px 6px rgba(0,0,0,.18),inset 0 2px 2px rgba(255,255,255,.9)}
.fb#f_bubo{width:clamp(70px,min(25vw,21vh),104px)}
.fb::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(20,20,24,.55) calc(var(--cd) * 360deg),transparent 0);pointer-events:none}
.fb:active:not(:disabled){transform:scale(.95);box-shadow:0 0 0 3px #7a7e85,0 0 0 5px #e3e5e8,0 0 0 6px #6f7379,inset 0 3px 6px rgba(0,0,0,.3)}
.fb .fn{font-size:14px;line-height:1.1;white-space:nowrap;position:relative;font-weight:900;letter-spacing:.02em;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.fb#f_bubo .fn{font-size:15px}
.fb .fp{font-family:'DotGothic16',monospace;font-weight:400;font-size:12px;color:#5d6066;position:relative}
.fb:disabled{cursor:default;filter:brightness(.88)}
.fb.go{box-shadow:0 0 0 3px var(--led),0 0 14px 4px var(--led-glow),0 0 0 6px #6f7379,inset 0 -4px 6px rgba(0,0,0,.18),inset 0 2px 2px rgba(255,255,255,.9);animation:glow .5s ease-in-out infinite alternate}
.fb.go .fp{color:#b86a00}
@keyframes glow{to{box-shadow:0 0 0 3px var(--led),0 0 22px 8px var(--led-glow),0 0 0 6px #6f7379,inset 0 -4px 6px rgba(0,0,0,.18),inset 0 2px 2px rgba(255,255,255,.9)}}
@media (max-height:420px){.farts{padding:8px 12px;max-width:360px}.fb .fn{font-size:12px}.fb#f_bubo .fn{font-size:13px}.fb .fp{font-size:11px}}
.blame{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:99px;box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:16px;padding:8px 20px;cursor:pointer;animation:popIn .3s cubic-bezier(.3,1.6,.5,1)}
.blame svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.blame .rn{position:absolute;top:-9px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;border:2px solid var(--ink);font-size:12px;line-height:18px;text-align:center;padding:0 4px}
@keyframes popIn{from{transform:scale(.3)}to{transform:scale(1)}}
.hint{position:absolute;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 150px);transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(14,12,11,.82);color:#fff;border-left:4px solid var(--led);padding:7px 14px;font-weight:900;font-size:15px;text-align:center;pointer-events:none}
.hint[data-k=rel]{color:var(--led);font-size:20px;text-shadow:0 0 8px var(--led-glow)}
@keyframes bob{to{transform:translate(-50%,-6px)}}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:hidden;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:14px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:default}
.card .no{font-family:var(--disp);font-size:14px;background:var(--ink);color:var(--yel);padding:2px 12px;border-radius:99px}
.card h3{font-family:var(--disp);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.1}
.card p{font-size:14px;font-weight:700;line-height:1.5}
.card .ctrl{display:flex;gap:8px;width:100%}
.card .ctrl b{color:var(--red-dk)}
.card .ctrl div{flex:1;border:2px solid var(--ink);border-radius:12px;padding:6px 4px;font-size:12px;font-weight:900;line-height:1.35;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.card .ctrl svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card .btn{min-height:50px}
.card .tally{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--red-dk)}
#count{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--disp);font-size:min(22vw,22vh,150px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);pointer-events:none}

/* 結果 */
#vResult{justify-content:center;padding-top:max(56px,calc(env(safe-area-inset-top) + 50px))}
.res{width:min(520px,100%);max-height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;align-items:center}
.resCard{position:relative;width:100%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;overflow:hidden}
.resTop{display:flex;gap:12px;align-items:center;width:100%}
#rPhoto{flex:none;width:clamp(84px,24vw,128px);height:clamp(84px,24vw,128px);border:3px solid var(--ink);border-radius:14px;background:#ddd}
.resNum{flex:1;min-width:0;text-align:center;padding-right:58px}
.resNum small{display:block;font-size:13px;font-weight:900}
.resNum .pct{font-family:var(--disp);font-size:clamp(46px,14vw,76px);line-height:1;color:var(--red)}
.resNum .pct span{font-size:.45em}
.rank{font-family:var(--disp);font-size:clamp(18px,5.4vw,24px);text-align:center;line-height:1.25}
.stamp{position:absolute;right:8px;top:8px;width:76px;height:76px;border:5px solid var(--red);color:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:18px;line-height:1.05;text-align:center;transform:rotate(-14deg) scale(0);opacity:0;background:rgba(255,248,236,.85)}
.stamp.on{animation:slam .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes slam{0%{transform:rotate(-14deg) scale(2.6);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:1}}
/* 集計は1行に畳む（数字の板を並べない） */
.db{width:100%;display:flex;gap:8px;align-items:baseline;justify-content:center;border-top:1px dashed #b9ab95;padding-top:6px}
.db small{font-size:12px;font-weight:700;color:#6b5f50}
.db b{font-family:'DotGothic16',monospace;font-weight:400;font-size:20px;line-height:1.1}
.db .cmp{display:none}
.stRow{width:100%;text-align:center;font-size:12px;font-weight:700;color:#6b5f50;line-height:1.4}
.stRow div{display:inline}
.stRow div+div::before{content:' / '}
.stRow div b{margin-left:3px;color:var(--ink)}
.stRow div.bad b{color:var(--red-dk)}
.resNum small.floor{font-size:15px;color:var(--red-dk);margin-top:2px}
.cmt{font-size:13px;font-weight:700;line-height:1.5;text-align:center}
.reveal{opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.reveal.on{opacity:1;transform:none}
.res .row .btn{min-height:50px;font-size:16px;padding:0 10px;white-space:nowrap}
#rBtns1 #bAgain{flex:1.7}#rBtns1 #bTitle{min-height:0}
.btn.xpost{background:#000;color:#fff}
.btn svg.xlogo{fill:currentColor;stroke:none;width:20px;height:20px}

/* 吹き出し・擬音（3D の上） */
.ono{position:absolute;left:0;top:0;font-family:var(--disp);white-space:nowrap;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);transform-origin:50% 50%;will-change:transform,opacity}
.ono.red{color:var(--red)}
.ono.yel{color:var(--yel)}
.ono.small{-webkit-text-stroke:2px var(--ink)}
.sb{position:absolute;left:0;top:0;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:5px 10px;font-weight:900;font-size:15px;white-space:nowrap;transform-origin:50% 100%}
.sb::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.verdict{position:absolute;left:0;top:0;font-family:var(--disp);font-size:clamp(24px,7vw,46px);padding:4px 16px;border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);white-space:nowrap;color:var(--ink)}
.verdict.perfect{background:var(--yel)}
.verdict.safe{background:#7dffe9}
.verdict.sus{background:#ffb35c}
.verdict.busted,.verdict.smell,.verdict.blameFail,.verdict.kicked{background:var(--red);color:#fff}
.verdict.roof{background:var(--yel)}
.verdict.blamed{background:#b9f07a}
.verdict.blameMiss{background:#ddd}
.sb.mine{background:var(--yel)}
.sx{display:flex;gap:6px;width:100%}
.sx span{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--ink);border-radius:10px;padding:3px 4px;font-size:12px;font-weight:900;background:#fff;white-space:nowrap;min-width:0}
.sx span.bad{background:#ffe1dc;color:var(--red-dk)}
.sx svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.paxL{width:100%;text-align:center;font-size:12px;font-weight:700;line-height:1.35;min-width:0}
.paxL span{display:none}
.paxL b{color:var(--red-dk)}

/* 小さい縦画面 */
@media (max-height:700px){
  .logo .main{font-size:min(11vw,6.6vh,60px)}
  .bubble{font-size:13px;padding:7px 10px}
  .btn{min-height:48px;font-size:16px}.btn.red{min-height:54px;font-size:19px}
  .step{font-size:13px}.step svg{width:38px;height:38px}
  .fb{min-height:74px}
  .resNum .pct{font-size:52px}#rPhoto{width:84px;height:84px}
  .paxL span{display:none}.resCard{gap:4px;padding:10px 12px}.cmt{font-size:12px}.bubble{line-height:1.45}
}
/* 背の低い横画面 */
@media (max-height:560px) and (orientation:landscape){
  .view{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  #vTitle{flex-direction:row;align-items:flex-end;justify-content:space-between;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  #vTitle .logo{width:44%;text-align:left;align-self:flex-start;margin-top:4px}
  .logo .main{font-size:min(6.4vw,13vh,56px)}
  .tBottom{width:min(380px,48%)}
  .mc .face{display:none}.bubble::before{display:none}
  #vHow{padding-top:max(52px,env(safe-area-inset-top))}
  .panel{padding:10px 14px}.panel h2{font-size:18px;margin-bottom:4px}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
  .step{font-size:12px}.step svg{width:34px;height:34px}
  #vHow{flex-direction:column}
  .fb{min-height:62px}.fb svg{width:22px;height:22px}.fb#f_bubo svg{width:26px;height:26px}
  .hint{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 130px)}
  .card{padding:10px 14px;gap:6px;width:min(560px,calc(100% - 32px))}
  .card h3{font-size:28px}.card p{font-size:13px}
  #vResult{padding-top:max(10px,env(safe-area-inset-top))}
  .res{width:min(760px,100%);flex-direction:row;align-items:stretch;gap:12px}
  .resCard{flex:1.3;padding:8px 12px;gap:4px}
  .resSide{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;min-width:0}
  .res .row .btn{font-size:14px;gap:6px;padding:0 8px}
  .res .row .btn svg{width:18px;height:18px}.res .row .btn svg.xlogo{width:15px;height:15px}
  #rPhoto{width:76px;height:76px}
  .resNum .pct{font-size:52px}
  .stamp{width:70px;height:70px;font-size:16px}
  .db b{font-size:18px}
}
.resSide{width:100%;display:flex;flex-direction:column;gap:8px}
@media (min-width:900px) and (min-height:700px){
  .hudTop{padding-top:16px;padding-left:16px}
}
/* ほかのバカゲー（結果・タイトルの入口と一覧） */
.more{display:flex;align-items:center;justify-content:center;gap:6px;align-self:center;min-height:40px;padding:0 14px;border:0;border-radius:99px;background:rgba(27,22,32,.6);color:var(--paper);font-weight:900;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.more svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#moreBox{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(20,10,25,.7)}
.moreP{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:8px 12px 12px;animation:popIn .2s cubic-bezier(.3,1.4,.5,1)}
.moreHd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.moreHd h2{font-family:var(--disp);font-weight:400;font-size:19px;padding-left:4px}
html[lang=ja] .moreHd h2{font-family:"Zen Maru Gothic",var(--disp);font-weight:900}
.moreX{flex:none;width:44px;height:44px;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.moreX svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
.moreL{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.moreL a{display:flex;flex-direction:column;min-width:0;background:#fff;color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.moreL a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.moreL img{display:block;width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;background:var(--paper-dk);border-bottom:2px solid var(--ink)}
.moreL b{display:block;padding:5px 8px 0;font-size:14px;font-weight:900;line-height:1.3}
.moreL span{display:block;padding:2px 8px 7px;font-size:11px;font-weight:700;line-height:1.4;color:#5a4f5e}
@media (max-height:560px) and (orientation:landscape){
  .moreP{width:min(820px,100%)}
  .moreL{grid-template-columns:repeat(4,1fr);gap:8px}
  .more{min-height:36px;font-size:13px}
}
#boot-err{position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px}
</style>

<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="fx"></div>

<div id="corner">
  <button id="bLang" type="button" aria-label="Language"><span id="langTxt">EN</span></button>
  <button id="bMute" type="button" aria-label="Sound">
    <svg id="icOn" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
    <svg id="icOff" viewBox="0 0 24 24" hidden><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</div>

<main id="vTitle" class="view">
  <h1 class="logo"><span class="en" data-t="badge"></span><span class="main" data-t="logo"></span></h1>
  <div class="tBottom">
    <div class="mc"><svg class="face" viewBox="0 0 48 48" data-face="mc"></svg><div class="bubble"><small data-t="mcName"></small><span data-t="lead"></span></div></div>
    <button class="btn red" id="bStart" type="button"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg><span data-t="start"></span></button>
    <button class="btn ghost" id="bHow" type="button" data-t="how"></button>
    <button class="more" id="bMoreT" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M18 14l3.5 3.5L18 21"/></svg><span data-t="more"></span></button>
  </div>
</main>

<main id="vHow" class="view" hidden>
  <div class="panel">
    <h2 data-t="howT"></h2>
    <div class="steps" id="howSteps"></div>
    <p class="credit">Sounds: Yle Arkisto / Zache (CC BY 3.0), Wildgruber et al. (CC BY 2.5), Jhang &amp; Oller (CC BY 4.0), Kenney ほか CC0。一覧は <a href="CREDITS.md" target="_blank" rel="noopener">CREDITS</a><br><a href="privacy.html" target="_blank" rel="noopener" style="display:inline-block;padding:12px 16px;margin:-8px 0 -12px">プライバシー / Privacy</a></p>
  </div>
  <button class="btn" id="bHowBack" type="button" data-t="back"></button>
</main>

<main id="vPlay" class="view" hidden>
  <div id="flash"></div>
  <div class="hudTop">
    <div class="stChip"><b id="hScore">0</b><div id="hLives"><i></i><i></i><i></i></div></div>
  </div>
  <div class="hudBot">
    <button type="button" class="blame" id="bBlame" hidden><svg viewBox="0 0 24 24"><path d="M2 12h10M8 8l4 4-4 4"/><circle cx="18" cy="8" r="3"/><path d="M14 20a4 4 0 0 1 8 0"/></svg><span class="rl"></span><span class="rn"></span></button>
    <div class="farts">
      <button type="button" class="fb" id="f_suka"><span class="fn"></span><span class="fp"></span></button>
      <button type="button" class="fb" id="f_pu"><span class="fn"></span><span class="fp"></span></button>
      <button type="button" class="fb" id="f_bubo"><span class="fn"></span><span class="fp"></span></button>
    </div>
  </div>
  <div class="hint" id="hint" hidden></div>
  <div id="count" hidden></div>
  <div class="card" id="introCard" hidden>
    <span class="no" id="iNo"></span>
    <h3 id="iName"></h3>
    <p id="iSub"></p>
    <div class="ctrl" id="iCtrl"></div>
    <button class="btn red" id="bGo" type="button" data-t="go"></button>
  </div>
</main>

<main id="vResult" class="view" hidden>
  <div class="res">
    <div class="resCard">
      <div class="stamp" id="rStamp"></div>
      <div class="resTop">
        <canvas id="rPhoto" width="256" height="256"></canvas>
        <div class="resNum"><small data-t="scoreL"></small><div class="pct"><b id="rPct">0</b><span data-t="scoreU"></span></div><small class="floor reveal" id="rFloor"></small></div>
      </div>
      <div class="rank reveal" id="rRank"></div>
      <div class="db reveal" id="rDb"><small data-t="maxDb"></small><b id="rDbN"></b><span class="cmp" id="rDbC"></span></div>
      <div class="paxL reveal" id="rPax"></div>
      <div class="stRow reveal" id="rStages"></div>
    </div>
    <div class="resSide">
      <div class="mc reveal" id="rMc"><svg class="face" viewBox="0 0 48 48" data-face="mc"></svg><div class="bubble"><small data-t="mcName"></small><span id="rCmt"></span></div></div>
      <div class="row reveal" id="rBtns1"><button class="btn red" id="bAgain" type="button" data-t="again"></button><button class="btn ghost" id="bTitle" type="button" data-t="toTitle"></button></div>
      <div class="row reveal" id="rBtns2"><button class="btn yel" id="bSave" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg><span data-t="save"></span></button><button class="btn xpost" id="bX" type="button"><svg class="xlogo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg><span data-t="xPost"></span></button></div>
      <button class="more reveal" id="bMore" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M18 14l3.5 3.5L18 21"/></svg><span data-t="more"></span></button>
    </div>
  </div>
</main>

<div id="moreBox" hidden role="dialog" aria-modal="true" aria-labelledby="moreH">
  <div class="moreP">
    <div class="moreHd"><h2 id="moreH" data-t="moreT"></h2><button type="button" id="bMoreX" class="moreX"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="moreL" id="moreL"></div>
  </div>
</div>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__hsReady) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },6000);
})();
</script>

<script src="data.js?v=13"></script>
<script type="module" src="game.js?v=14"></script>
